data:
  train_h5_paths:
    - /home/laptop/Projects/glorbot2/factr2_next/data/train_corpus_1.h5
  val_h5_paths:
    - /home/laptop/Projects/glorbot2/factr2_next/data/validation_corpus_1.h5

  train_episodes: all
  val_episodes: all

  # Each model maps [7 arm joints, torso] histories to 7 arm torques.
  # Bimanual H5 files train one independent NEXT model per arm.
  arm_mode: both
  arms: [left, right]
  keys:
    joint_pos: "{arm}_joint_pos"
    joint_vel: "{arm}_joint_vel"
    joint_cmd: "{arm}_joint_cmd"
    measured_joint_torque: "{arm}_measured_joint_torque"
  history: 80

  # Used only when val_h5_paths is empty.
  val_fraction: 0.1
  val_split: contiguous
  val_buffer_windows: 80

model:
  type: lstm
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  head_hidden: 256
  head_layers: 2
  dropout: 0.1

train:
  batch_size: 2048
  epochs: 20
  learning_rate: 0.001
  device: cuda
  seed: 0

save:
  output_dir: runs
  run_name: next_glorbot2_free_torque

next:
  sign_convention: measured_minus_predicted
