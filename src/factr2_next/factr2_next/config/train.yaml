data:
  train_h5_paths:
    - /home/philip/Projects/factr2_next/data/free_motion_20260704_012657.h5
    - /home/philip/Projects/factr2_next/data/free_motion_20260704_125126.h5
    - /home/philip/Projects/factr2_next/data/free_motion_20260707_031702.h5
  train_episodes: all
  val_h5_paths:
    - /home/philip/Projects/factr2_next/data/free_motion_20260707_033047.h5
  val_episodes: all
  report_val_by_episode: true
  arm_mode: both
  arms: [left, right]
  keys:
    joint_pos: "{arm}_joint_pos"
    joint_vel: "{arm}_joint_vel"
    joint_cmd: "{arm}_joint_cmd"
    measured_joint_torque: "{arm}_measured_joint_torque"
  history: 50
  val_fraction: 0.1
  val_split: contiguous
  val_buffer_windows: 50

model:
  type: lstm
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  head_hidden: 256
  head_layers: 2
  dropout: 0.1

train:
  batch_size: 2048
  epochs: 20
  learning_rate: 0.001
  device: cuda
  seed: 0

save:
  output_dir: runs
  run_name: next_free_torque

# NEXT learns tau_free from free-motion data.
# During inference: tau_ext_hat = tau_measured - tau_free_hat.
next:
  sign_convention: measured_minus_predicted
