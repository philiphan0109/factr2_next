output_dir: data
session_name: glorbot2_free_motion

sync:
  queue_size: 20
  slop_seconds: 0.03

recording:
  target_hz: 60.0
  min_hz: 50.0
  sample_timeout_seconds: 0.2
  warn_after_seconds: 2.0

# Published by two Glorbot2 NEXT adapter nodes, one per arm.
topics:
  left_joint_pos:
    topic: /next_adapter/glorbot2_1/nero_left/joint_pos_obs
    field: position

  left_joint_vel:
    topic: /next_adapter/glorbot2_1/nero_left/joint_vel_obs
    field: position

  left_joint_cmd:
    topic: /next_adapter/glorbot2_1/nero_left/joint_pos_cmd
    field: position

  left_measured_joint_torque:
    topic: /next_adapter/glorbot2_1/nero_left/joint_effort_obs
    field: position

  right_joint_pos:
    topic: /next_adapter/glorbot2_1/nero_right/joint_pos_obs
    field: position

  right_joint_vel:
    topic: /next_adapter/glorbot2_1/nero_right/joint_vel_obs
    field: position

  right_joint_cmd:
    topic: /next_adapter/glorbot2_1/nero_right/joint_pos_cmd
    field: position

  right_measured_joint_torque:
    topic: /next_adapter/glorbot2_1/nero_right/joint_effort_obs
    field: position
