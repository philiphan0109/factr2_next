output_dir: data
session_name: free_motion

# Root namespace for the robot/arm being recorded.
robot_topic_root: /piper/right

sync:
  queue_size: 20
  slop_seconds: 0.03

recording:
  target_hz: 50.0
  min_hz: 45.0
  sample_timeout_seconds: 0.2
  warn_after_seconds: 2.0

# Synchronized samples are cached, then rows are written by a fixed-rate timer:
# ep_0000/<key>/data and ep_0000/<key>/timestamps.
topics:
  joint_pos:
    topic: "{robot_topic_root}/joint_pos_obs"
    field: position

  joint_vel:
    topic: "{robot_topic_root}/joint_vel_obs"
    field: position

  joint_cmd:
    topic: "{robot_topic_root}/joint_pos_cmd"
    field: position

  # Piper publishes observed effort/current in JointState.position.
  # For standard JointState effort, set field: effort.
  measured_joint_torque:
    topic: "{robot_topic_root}/joint_effort_obs"
    field: position
