checkpoint_dir: /home/philip/Projects/factr2_next/runs/next_free_torque_right_20260704_130129
arm: right
device: cpu

sync:
  queue_size: 20
  slop_seconds: 0.03

topics:
  joint_pos:
    topic: /piper/{arm}/joint_pos_obs
    type: sensor_msgs/JointState
    field: position

  joint_vel:
    topic: /piper/{arm}/joint_vel_obs
    type: sensor_msgs/JointState
    field: position

  joint_cmd:
    topic: /piper/{arm}/joint_pos_cmd
    type: sensor_msgs/JointState
    field: position

  measured_joint_torque:
    topic: /piper/{arm}/joint_effort_obs
    type: sensor_msgs/JointState
    field: position

outputs:
  # Torque vectors are published as sensor_msgs/JointState with values in .position
  # to match the current recorder/driver convention.
  external_joint_torque: /next/{arm}/external_joint_torque
  external_joint_torque_raw: /next/{arm}/external_joint_torque/raw
  free_joint_torque_pred: /next/{arm}/free_joint_torque_pred
  mse: /next/{arm}/mse
  score: /next/{arm}/score
  contact_state: /next/{arm}/contact_state

smoothing:
  # Applied only to external_joint_torque. The raw signal is always published.
  # mode: none, ema, lowpass
  enabled: true
  mode: ema
  ema_alpha: 0.2
  cutoff_hz: 5.0
  sample_hz: 50.0

score:
  # Published to /next/{arm}/score as norm(tau_ext) / scale.
  # source: filtered_external_joint_torque, raw_external_joint_torque
  # norm: l1, l2, linf
  source: filtered_external_joint_torque
  norm: l1
  scale: 1.0

contact:
  # Hysteresis over the published score.
  enabled: true
  low_threshold: 1.0
  high_threshold: 2.0

# Paper convention:
# tau_ext_hat = tau_measured - tau_free_hat
next:
  sign_convention: measured_minus_predicted
